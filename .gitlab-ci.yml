# GitLab Pages 배포
# 이 저장소는 index.html 한 장짜리 정적 사이트라 빌드 과정이 없다.
# 기본 브랜치(main)에 push 되면 저장소 내용을 public/ 으로 복사해 그대로 게시한다.
# GitHub 는 이 파일을 무시하므로 GitHub Pages 배포에는 아무 영향이 없다.
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir .public
    - cp -r * .public          # 숨김 파일(.gitlab-ci.yml, .public)은 * 에 안 걸린다
    - mv .public public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
